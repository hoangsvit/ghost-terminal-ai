# Keep GitHub Actions up to date; application itself has no pip/npm runtime manifests.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
