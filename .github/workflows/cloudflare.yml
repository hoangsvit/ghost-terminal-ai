name: Hosted Worker CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare Worker syntax
        run: node --check cloudflare/worker.mjs
      - name: Run offline hosted API tests
        run: node --test cloudflare/worker.test.mjs
