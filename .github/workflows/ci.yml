name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and integration tests (offline; mock Ollama)
        run: python -m unittest discover -s tests -v
      - name: Validate VM deployment scripts
        run: |
          bash -n vm/deploy.sh
          bash -n vm/startup.sh
      - name: Compile all Python source files
        run: python -m compileall -q app.py ghost_terminal
